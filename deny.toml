[graph]
all-features = true

[advisories]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
    { crate = "openssl", reason = "Networking is pinned to rustls" },
    { crate = "openssl-sys", reason = "Networking is pinned to rustls" },
    { crate = "native-tls", reason = "Networking is pinned to rustls" },
]
skip = [
    { crate = "getrandom@0.2.17", reason = "p256 and ring remain on rand_core 0.6 while ahash and test tooling use getrandom 0.3" },
    { crate = "syn@2.0.119", reason = "cryptographic and serialization derives have not migrated to the syn 3 ecosystem used by current async dependencies" },
    { crate = "windows-sys@0.52.0", reason = "ring retains its older Windows compatibility layer while current Tokio tooling uses windows-sys 0.61" },
    { crate = "http@0.2.12", reason = "Actix remains on http 0.2 while reqwest, Axum, and Tower use http 1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
