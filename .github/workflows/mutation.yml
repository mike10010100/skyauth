name: Mutation Testing

on:
  schedule:
    - cron: '0 4 * * 1'  # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: 'Mutation scope: security-core (default) or full'
        required: false
        default: 'security-core'
        type: choice
        options:
          - security-core
          - full

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing (cargo-mutants ≥ 70% kill)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cargo Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-mutants

      - name: Run mutation testing (security-core scope)
        if: github.event_name == 'push' || github.event.inputs.scope != 'full'
        run: |
          cargo mutants -j4 --timeout 300 --no-shuffle \
            --exclude src/verification/formal_models.rs \
            --exclude src/verification/kani_harnesses.rs

      - name: Run mutation testing (full scope)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.scope == 'full'
        run: cargo mutants -j4 --timeout 300 --no-shuffle

      - name: Enforce kill-rate floor (≥ 70%)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          outcomes = json.load(open("mutants.out/outcomes.json"))
          caught = sum(1 for o in outcomes if o.get("caught"))
          unviable = sum(1 for o in outcomes if o.get("unviable"))
          viable = len(outcomes) - unviable
          rate = caught / viable if viable else 0.0
          summary = f"Mutation kill rate: {caught}/{viable} = {rate:.1%}".rstrip()
          print(summary)
          with open("mutants.out/summary.txt", "w") as f:
              f.write(summary + "\n")
          survivors = [o for o in outcomes if not o.get("caught") and not o.get("unviable")]
          if survivors:
              print("Survivors (test gaps):")
              for s in survivors:
                  mut = s.get("mutant", {})
                  print(f"  - {mut.get('file')}:{mut.get('line')} — {mut.get('replacement')}")
          if rate < 0.70:
              print("::error::kill rate below 70% floor")
              sys.exit(1)
          PY

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutants.out/
          retention-days: 30
