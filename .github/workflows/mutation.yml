name: Mutation Testing

on:
  # Weekly sweep only. Full cargo-mutants coverage is ~864 mutants (~8 CPU-hours);
  # sharding across 4 parallel runners keeps each job ~1.5-2h, within GitHub's 6h
  # job cap without monopolizing runner capacity.
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  KILL_RATE_FLOOR: "0.70"

jobs:
  sweep:
    name: Mutation Sweep (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: primitives
            files: --file src/crypto.rs --file src/pkce.rs --file src/session.rs
          - name: dpop
            files: --file src/dpop.rs
          - name: ssrf-identity
            files: --file src/ssrf.rs --file src/identity.rs
          - name: flows
            files: --file src/client.rs --file src/par.rs --file src/discovery.rs --file src/store.rs
          - name: integrations
            files: --file src/integrations
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cargo Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-mutants

      - name: Run mutation sweep (${{ matrix.shard.name }})
        run: >
          cargo mutants -j2 --timeout 300 --no-shuffle
          ${{ matrix.shard.files }}

      - name: Enforce kill-rate floor
        run: |
          python3 -c "
          import json, sys, os
          name = '${{ matrix.shard.name }}'
          floor = float(os.environ['KILL_RATE_FLOOR'])
          outcomes = json.load(open('mutants.out/outcomes.json'))
          caught = sum(1 for o in outcomes if o.get('caught'))
          unviable = sum(1 for o in outcomes if o.get('unviable'))
          viable = len(outcomes) - unviable
          rate = caught / viable if viable else 0.0
          print(f\"Shard '{name}' kill rate: {caught}/{viable} = {rate:.1%}\")
          survivors = [o for o in outcomes if not o.get('caught') and not o.get('unviable')]
          for s in survivors:
              mut = s.get('mutant', {})
              print(f\"  survivor: {mut.get('file')}:{mut.get('line')} - {mut.get('replacement')}\")
          if rate < floor:
              print('::error::shard kill rate below floor')
              sys.exit(1)
          "

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.shard.name }}
          path: mutants.out/
          retention-days: 30